<style>
html,body{height:100%;}
body{margin:0;background:#070b16;}
.wk-root{
  --ink:#070b16; --panel:#0e1626; --panel2:#111c31; --raise:#16223b;
  --line:rgba(120,150,220,.14); --line2:rgba(120,150,220,.09);
  --cobalt:#2f6bff; --cobalt-b:#4d8bff; --azure:#78acff;
  --glow:rgba(47,107,255,.5);
  --text:#eaf0ff; --muted:#7f8fb6; --ok:#33d6a6;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text); font-family:var(--sans);
  background:
    radial-gradient(1100px 640px at 78% -12%, rgba(47,107,255,.20), transparent 60%),
    radial-gradient(760px 520px at -8% 8%, rgba(47,107,255,.10), transparent 55%),
    var(--ink);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  padding:max(26px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  box-sizing:border-box;
}
.wk-root *{box-sizing:border-box;}
.wk-shell{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
.wk-muted{color:var(--muted);}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0;}
.wk-brand{display:flex;align-items:center;gap:10px;}
.wk-mark{width:14px;height:14px;border-radius:4px;background:linear-gradient(150deg,var(--cobalt-b),var(--cobalt));box-shadow:0 0 16px var(--glow);}
.wk-brandtxt{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;color:#cdd8f5;font-weight:600;}
.wk-dot{color:var(--muted);}
.wk-date{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--muted);text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;}
.wk-hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 22px 18px;background:linear-gradient(160deg, rgba(47,107,255,.22), rgba(20,32,58,.55) 46%, var(--panel));border:1px solid rgba(80,130,255,.28);box-shadow:0 24px 60px -30px rgba(47,107,255,.6), inset 0 1px 0 rgba(255,255,255,.05);}
.wk-hero.done{border-color:rgba(51,214,166,.34);box-shadow:0 24px 60px -34px rgba(51,214,166,.5), inset 0 1px 0 rgba(255,255,255,.05);}
.wk-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.wk-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--azure);margin-bottom:8px;}
.wk-hero-title{margin:0;font-size:30px;line-height:1.02;letter-spacing:-.02em;font-weight:800;}
.wk-hero-sub{margin-top:6px;color:var(--muted);font-size:13.5px;}
.wk-hero-ico{flex-shrink:0;width:78px;height:78px;border-radius:16px;display:grid;place-items:center;background:rgba(9,16,32,.5);border:1px solid var(--line);}
.wk-heroart{width:52px;height:52px;color:#cfe0ff;}
.wk-prompt{margin-top:18px;padding-top:16px;border-top:1px solid rgba(120,150,220,.18);}
.wk-prompt-q{font-size:16px;font-weight:600;margin-bottom:12px;}
.wk-prompt-actions{display:flex;gap:10px;}
.wk-btn{flex:1;padding:13px 14px;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:transform .12s ease,box-shadow .2s ease,background .2s;font-family:inherit;}
.wk-btn:active{transform:translateY(1px) scale(.995);}
.wk-btn-yes{color:#fff;background:linear-gradient(140deg,var(--cobalt-b),var(--cobalt));box-shadow:0 12px 26px -12px var(--glow);}
.wk-btn-yes:hover{box-shadow:0 16px 34px -12px var(--glow);}
.wk-btn-no{background:rgba(120,150,220,.08);border-color:var(--line);color:#c3cfec;}
.wk-btn-no:hover{background:rgba(120,150,220,.14);}
.wk-prompt-done{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;}
.wk-check{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,#4ef0bd,var(--ok));color:#05231a;font-weight:900;font-size:15px;}
.wk-check.rest{background:rgba(120,150,220,.16);color:var(--muted);}
.wk-undo{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 11px;border-radius:9px;cursor:pointer;font-family:var(--mono);letter-spacing:.03em;}
.wk-undo:hover{color:#cdd8f5;border-color:rgba(120,150,220,.32);}
.wk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.wk-day{position:relative;padding:12px 0;border-radius:12px;cursor:pointer;background:var(--panel);border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;transition:all .15s ease;}
.wk-day:hover{color:#cdd8f5;border-color:var(--line);transform:translateY(-1px);}
.wk-day.active{color:#fff;background:linear-gradient(150deg,rgba(47,107,255,.9),rgba(29,72,200,.9));border-color:transparent;box-shadow:0 10px 24px -12px var(--glow);}
.wk-day.today:not(.active){color:var(--azure);}
.wk-todaymark{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--cobalt-b);box-shadow:0 0 8px var(--glow);}
.wk-day.active .wk-todaymark{background:#fff;box-shadow:none;}
.wk-panel{border-radius:18px;background:linear-gradient(180deg,var(--panel),#0b1322);border:1px solid var(--line);padding:20px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.wk-panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
.wk-panel-title{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;}
.wk-panel-muscle{color:var(--muted);font-weight:500;font-size:14px;}
.wk-pill{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:#bcd0ff;padding:7px 11px;border-radius:20px;background:rgba(47,107,255,.10);border:1px solid rgba(80,130,255,.28);white-space:nowrap;}
.wk-pulse{width:7px;height:7px;border-radius:50%;background:var(--cobalt-b);box-shadow:0 0 0 0 var(--glow);animation:wkpulse 1.8s infinite;}
@keyframes wkpulse{0%{box-shadow:0 0 0 0 rgba(77,139,255,.6);}70%{box-shadow:0 0 0 7px rgba(77,139,255,0);}100%{box-shadow:0 0 0 0 rgba(77,139,255,0);}}
.wk-exnote{margin:-4px 0 14px;font-size:12.5px;color:var(--azure);font-family:var(--mono);letter-spacing:.02em;}
.wk-flow{list-style:none;margin:0;padding:0;position:relative;}
.wk-flow::before{content:"";position:absolute;left:17px;top:16px;bottom:16px;width:2px;background:linear-gradient(180deg,transparent,rgba(77,139,255,.5) 10%,rgba(77,139,255,.5) 90%,transparent);}
.wk-step{position:relative;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:6px 0;align-items:center;animation:wkin .45s ease both;}
.wk-step:nth-child(1){animation-delay:.02s}.wk-step:nth-child(2){animation-delay:.05s}.wk-step:nth-child(3){animation-delay:.08s}.wk-step:nth-child(4){animation-delay:.11s}.wk-step:nth-child(5){animation-delay:.14s}.wk-step:nth-child(6){animation-delay:.17s}.wk-step:nth-child(7){animation-delay:.20s}.wk-step:nth-child(8){animation-delay:.23s}
@keyframes wkin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.wk-node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;z-index:1;font-family:var(--mono);font-size:13px;font-weight:700;background:var(--panel2);border:2px solid rgba(120,150,220,.3);color:#aebbe0;}
.wk-node.work{background:linear-gradient(150deg,var(--cobalt-b),var(--cobalt));border-color:transparent;color:#fff;box-shadow:0 0 16px -2px var(--glow);}
.wk-node.daily{background:rgba(120,172,255,.14);border-color:rgba(120,172,255,.5);color:var(--azure);}
.wk-node.warm{background:transparent;border-style:dashed;border-color:rgba(120,150,220,.4);color:var(--muted);}
.wk-card{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:13px;background:var(--panel2);border:1px solid var(--line2);transition:border-color .15s,background .15s;}
.wk-card:hover{border-color:var(--line);background:var(--raise);}
.wk-card.exercise{background:rgba(47,107,255,.06);border-color:rgba(80,130,255,.18);}
.wk-ico{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;background:rgba(8,14,28,.55);border:1px solid var(--line2);}
.wk-cardart{width:32px;height:32px;color:#cfe0ff;}
.wk-card.daily .wk-cardart{color:var(--azure);}
.wk-cardmeta{display:flex;flex-direction:column;gap:2px;min-width:0;}
.wk-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.wk-cardtitle{font-size:15px;font-weight:700;letter-spacing:-.01em;}
.wk-cardsub{font-size:12px;color:var(--muted);}
.wk-notes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.wk-notecard{font-size:12.5px;line-height:1.5;color:#c0cbe8;padding:12px 13px;border-radius:12px;background:rgba(120,150,220,.05);border:1px solid var(--line2);}
.wk-noteflag{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--azure);margin-bottom:5px;}
.wk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.wk-stat{padding:14px 12px;border-radius:13px;background:var(--panel2);border:1px solid var(--line2);}
.wk-statval{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1;}
.wk-statunit{font-size:11px;color:var(--muted);font-weight:500;}
.wk-statlabel{margin-top:7px;font-size:11px;color:var(--muted);letter-spacing:.02em;}
.wk-calnav{display:flex;align-items:center;gap:10px;}
.wk-navbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:#cdd8f5;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;}
.wk-navbtn:hover{background:var(--raise);}
.wk-calmonth{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:#cdd8f5;min-width:132px;text-align:center;text-transform:capitalize;}
.wk-calhead,.wk-calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
.wk-calhead{margin-bottom:8px;}
.wk-calhead span{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);}
.wk-cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:12.5px;cursor:pointer;display:grid;place-items:center;transition:transform .12s,border-color .15s,background .15s;padding:0;}
.wk-cell:hover:not(.future){transform:translateY(-1px);border-color:var(--line);color:#dfe7fb;}
.wk-cell.empty{background:none;border:none;cursor:default;}
.wk-cell.on{color:#fff;font-weight:700;background:linear-gradient(150deg,var(--cobalt-b),var(--cobalt));border-color:transparent;box-shadow:0 8px 18px -10px var(--glow);}
.wk-cell.rest{color:#93a2c7;border-style:dashed;border-color:rgba(120,150,220,.3);}
.wk-cell.now{outline:2px solid var(--azure);outline-offset:1px;}
.wk-cell.future{opacity:.4;cursor:default;}
.wk-legend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px;font-size:11.5px;color:var(--muted);}
.wk-legend span{display:inline-flex;align-items:center;gap:6px;}
.wk-legend .lg{width:12px;height:12px;border-radius:4px;display:inline-block;}
.lg.on{background:linear-gradient(150deg,var(--cobalt-b),var(--cobalt));}
.lg.rest{border:1px dashed rgba(120,150,220,.5);}
.lg.now{background:var(--panel2);outline:2px solid var(--azure);outline-offset:-1px;}
.wk-legend-hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;}
.wk-foot{text-align:center;font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.03em;padding-top:4px;}
@media (max-width:560px){
  .wk-root{padding:max(18px,env(safe-area-inset-top)) 11px calc(30px + env(safe-area-inset-bottom));}
  .wk-date{display:none;}
  .wk-hero-title{font-size:25px;}
  .wk-hero-ico{width:64px;height:64px;}
  .wk-heroart{width:42px;height:42px;}
  .wk-stats{grid-template-columns:repeat(2,1fr);}
  .wk-notes{grid-template-columns:1fr;}
  .wk-prompt-actions{flex-direction:column;}
  .wk-legend-hint{width:100%;margin-left:0;}
  .wk-pill{display:none;}
}
@media (prefers-reduced-motion:reduce){.wk-step{animation:none;}.wk-pulse{animation:none;}}
</style>
</head>
<body>
<div id="app" class="wk-root"></div>
<script>
/* ---------------- data ---------------- */
var WEEKDAYS=[
 {short:"Mo",long:"Montag"},{short:"Di",long:"Dienstag"},{short:"Mi",long:"Mittwoch"},
 {short:"Do",long:"Donnerstag"},{short:"Fr",long:"Freitag"},{short:"Sa",long:"Samstag"},
 {short:"So",long:"Sonntag"}
];
var DAILIES=[
 {name:"30 Push-ups",art:"pushups"},{name:"50 Squats",art:"squats"},
 {name:"20 Pull-ups",art:"pullups"},{name:"1 Min Plank",art:"plank"}
];
var DAY_EX=[
 {name:"Lateral Raises",muscle:"Schultern · seitlich",art:"lateral",warmup:true,sets:["Schwer","Schwer","Leicht"]},
 {name:"Bulgarian Split Squat",muscle:"Beine",art:"bulgarian",warmup:true,unilateral:true,sets:["Schwer","Schwer","Schwer / leicht"]},
 {name:"Bizeps Curl",muscle:"Bizeps",art:"curl",warmup:true,unilateral:true,note:"gleichzeitig oder abwechselnd",sets:["Schwer","Schwer","Leicht"]},
 {name:"Overhead Press",muscle:"Schultern",art:"overhead",warmup:true,sets:["Schwer","Schwer","Schwer / leicht"]},
 {name:"Dumbbell Pullover",muscle:"Brust",art:"pullover",warmup:true,sets:["Schwer","Schwer","Schwer / leicht"]},
 {name:"Skullcrusher",muscle:"Trizeps",art:"skullcrusher",warmup:true,unilateral:true,sets:["Schwer","Schwer","Leicht"]},
 {name:"Scapular Push-ups",muscle:"Schultergürtel",art:"scapular",warmup:false,note:"4 Sätze · direkt Arbeitssatz statt Aufwärmen",sets:["Arbeitssatz","Arbeitssatz","Arbeitssatz","Arbeitssatz"]}
];

/* ---------------- artwork ---------------- */
function hd(x,y){return '<g stroke="none" fill="currentColor"><rect x="'+(x-6)+'" y="'+(y-1.2)+'" width="12" height="2.4" rx="1.2"/><rect x="'+(x-7.2)+'" y="'+(y-4)+'" width="2.6" height="8" rx="1.3"/><rect x="'+(x+4.6)+'" y="'+(y-4)+'" width="2.6" height="8" rx="1.3"/></g>';}
function vd(x,y){return '<g stroke="none" fill="currentColor"><rect x="'+(x-1.2)+'" y="'+(y-6)+'" width="2.4" height="12" rx="1.2"/><rect x="'+(x-4)+'" y="'+(y-7.2)+'" width="8" height="2.6" rx="1.3"/><rect x="'+(x-4)+'" y="'+(y+4.6)+'" width="8" height="2.6" rx="1.3"/></g>';}
var ART={
 pushups:'<line x1="6" y1="41" x2="43" y2="41"/><circle cx="11" cy="26" r="3.4"/><path d="M14 26 H40"/><path d="M40 26 L42 39"/><path d="M17 27 L16 39"/><path d="M21 27 L21 39"/>',
 squats:'<line x1="12" y1="43" x2="36" y2="43"/><circle cx="24" cy="10" r="3.6"/><path d="M24 14 V24"/><path d="M24 24 L17 28 L17 42"/><path d="M24 24 L31 28 L31 42"/><path d="M24 17 H35"/>',
 pullups:'<line x1="9" y1="9" x2="39" y2="9"/><path d="M18 9 V13"/><path d="M30 9 V13"/><path d="M18 13 L22 20"/><path d="M30 13 L26 20"/><circle cx="24" cy="23" r="3.6"/><path d="M24 27 V37"/><path d="M24 37 L20 44"/><path d="M24 37 L28 44"/>',
 plank:'<line x1="6" y1="40" x2="43" y2="40"/><circle cx="11" cy="25" r="3.4"/><path d="M14 26 H40"/><path d="M40 26 L42 38"/><path d="M16 27 V39 H23"/>',
 lateral:'<circle cx="24" cy="11" r="3.8"/><path d="M24 15 V31"/><path d="M24 31 L19 43"/><path d="M24 31 L29 43"/><path d="M24 19 H11"/><path d="M24 19 H37"/>'+vd(10,19)+vd(38,19),
 bulgarian:'<line x1="6" y1="39" x2="14" y2="39"/><circle cx="22" cy="11" r="3.6"/><path d="M22 15 L21 26"/><path d="M21 26 L26 33 L26 43"/><path d="M21 26 L14 33 L11 38"/><path d="M22 19 L17 27"/><path d="M22 19 L27 27"/>'+vd(16,29)+vd(28,29),
 curl:'<circle cx="24" cy="11" r="3.8"/><path d="M24 15 V31"/><path d="M24 31 L19 43"/><path d="M24 31 L29 43"/><path d="M24 19 L20 27"/><path d="M20 27 L22 19"/>'+hd(22,18)+'<path d="M24 19 L30 29"/>'+vd(31,31),
 overhead:'<circle cx="24" cy="13" r="3.8"/><path d="M24 17 V32"/><path d="M24 32 L19 44"/><path d="M24 32 L29 44"/><path d="M24 20 L16 10"/><path d="M24 20 L32 10"/>'+hd(15,9)+hd(33,9),
 pullover:'<line x1="8" y1="35" x2="40" y2="35"/><circle cx="13" cy="31" r="3.4"/><path d="M16 32 H30"/><path d="M30 32 L34 26 L38 32"/><path d="M16 32 L9 24"/>'+hd(8,23),
 skullcrusher:'<line x1="8" y1="35" x2="40" y2="35"/><circle cx="13" cy="31" r="3.4"/><path d="M16 32 H30"/><path d="M30 32 L34 26 L38 32"/><path d="M19 32 L19 22"/><path d="M19 22 L13 25"/>'+hd(12,25),
 scapular:'<line x1="6" y1="40" x2="43" y2="40"/><circle cx="11" cy="25" r="3.4"/><path d="M14 26 H40"/><path d="M40 26 L42 38"/><path d="M17 27 V39"/><path d="M21 27 V39"/><path d="M27 14 V22 M25 16 L27 14 L29 16 M25 20 L27 22 L29 20"/>',
 warmup:'<circle cx="24" cy="12" r="3.8"/><path d="M24 16 V30"/><path d="M24 30 L19 43"/><path d="M24 30 L29 43"/><path d="M24 19 L16 8"/><path d="M24 19 L32 8"/>'
};
function svg(art,cls){return '<svg class="'+cls+'" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ART[art]+'</svg>';}

/* ---------------- utils ---------------- */
function pad(n){return String(n).padStart(2,"0");}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function progIdx(d){return (d.getDay()+6)%7;}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function esc(s){return String(s);}

/* ---------------- state ---------------- */
var KEY="leo_training_log_v1";
var log={};
try{log=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){log={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(log));}catch(e){}}

var now=new Date();
var todayKey=keyOf(now);
var todayIdx=progIdx(now);
var selected=todayIdx;
var calY=now.getFullYear(), calM=now.getMonth();

function setEntry(k,val){
  if(val===undefined){delete log[k];} else {log[k]=val;}
  save(); render();
}

/* ---------------- logic ---------------- */
function buildFlow(idx){
  var ex=DAY_EX[idx], slots;
  if(ex.warmup){
    slots=[{label:"Aufwärmen",kind:"warmup"},
      {label:"Satz 1 · "+ex.sets[0],kind:"work"},
      {label:"Satz 2 · "+ex.sets[1],kind:"work"},
      {label:"Satz 3 · "+ex.sets[2],kind:"work"}];
  } else {
    slots=ex.sets.map(function(s,i){return {label:"Satz "+(i+1)+" · "+s,kind:"work"};});
  }
  var flow=[];
  for(var i=0;i<4;i++){
    flow.push({type:"exercise",title:ex.name,sub:slots[i].label,kind:slots[i].kind,art:ex.art,
      unilateral: ex.unilateral && slots[i].kind==="work"});
    flow.push({type:"daily",title:DAILIES[i].name,art:DAILIES[i].art});
  }
  return flow;
}
function computeStats(){
  var total=Object.keys(log).filter(function(k){return log[k]===true;}).length;
  var streak=0, d=startOfDay(now);
  if(log[keyOf(d)]!==true){d.setDate(d.getDate()-1);}
  while(log[keyOf(d)]===true){streak++; d.setDate(d.getDate()-1);}
  var wk=startOfDay(now); wk.setDate(wk.getDate()-progIdx(now));
  var week=0;
  for(var i=0;i<7;i++){var c=new Date(wk);c.setDate(wk.getDate()+i);if(log[keyOf(c)]===true)week++;}
  var month=0;
  Object.keys(log).forEach(function(k){
    if(log[k]!==true)return;
    var p=k.split("-").map(Number);
    if(p[0]===now.getFullYear() && p[1]===now.getMonth()+1) month++;
  });
  return {total:total,streak:streak,week:week,month:month};
}

/* ---------------- render ---------------- */
function render(){
  var st=computeStats();
  var todayEx=DAY_EX[todayIdx], selEx=DAY_EX[selected];
  var status=log[todayKey];
  var dateLabel=now.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"});

  /* prompt */
  var prompt;
  if(status===undefined){
    prompt='<div class="wk-prompt-q">Hast du heute trainiert?</div>'+
      '<div class="wk-prompt-actions">'+
      '<button class="wk-btn wk-btn-yes" data-act="yes">Ja, erledigt</button>'+
      '<button class="wk-btn wk-btn-no" data-act="no">Nein, Pause</button></div>';
  } else if(status===true){
    prompt='<div class="wk-prompt-done"><span class="wk-check">✓</span>'+
      '<span>Heute trainiert. Serie: '+st.streak+' Tage.</span>'+
      '<button class="wk-undo" data-act="undo">Rückgängig</button></div>';
  } else {
    prompt='<div class="wk-prompt-done rest"><span class="wk-check rest">–</span>'+
      '<span>Heute als Pause markiert.</span>'+
      '<button class="wk-undo" data-act="resttoyes">Doch trainiert</button></div>';
  }

  /* day picker */
  var days=WEEKDAYS.map(function(d,i){
    return '<button class="wk-day'+(i===selected?" active":"")+(i===todayIdx?" today":"")+'" data-act="day" data-i="'+i+'">'+
      d.short+(i===todayIdx?'<span class="wk-todaymark"></span>':'')+'</button>';
  }).join("");

  /* flow */
  var flow=buildFlow(selected).map(function(s,i){
    var node=s.type==="daily"?"daily":(s.kind==="warmup"?"warm":"work");
    var kick=s.type==="daily"?"Daily":(s.kind==="warmup"?"Aufwärmen":"Übung");
    var sub=s.type==="daily"?"am Stück · sonst minimal Pause":s.sub;
    if(s.unilateral) sub+=" · links & rechts";
    return '<li class="wk-step"><div class="wk-node '+node+'">'+(i+1)+'</div>'+
      '<div class="wk-card '+s.type+'"><span class="wk-ico">'+svg(s.art,"wk-cardart")+'</span>'+
      '<span class="wk-cardmeta"><span class="wk-kicker">'+kick+'</span>'+
      '<span class="wk-cardtitle">'+s.title+'</span>'+
      '<span class="wk-cardsub">'+sub+'</span></span></div></li>';
  }).join("");

  /* calendar */
  var monthLabel=new Date(calY,calM,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  var lead=(new Date(calY,calM,1).getDay()+6)%7;
  var dim=new Date(calY,calM+1,0).getDate();
  var todayMid=startOfDay(now).getTime();
  var cells="";
  for(var l=0;l<lead;l++) cells+='<span class="wk-cell empty"></span>';
  for(var day=1;day<=dim;day++){
    var date=new Date(calY,calM,day), k=keyOf(date), state=log[k];
    var isToday=k===todayKey, isFut=startOfDay(date).getTime()>todayMid;
    cells+='<button class="wk-cell'+(state===true?" on":"")+(state===false?" rest":"")+
      (isToday?" now":"")+(isFut?" future":"")+'" '+(isFut?"disabled":"")+
      ' data-act="cell" data-key="'+k+'">'+day+'</button>';
  }
  var head=WEEKDAYS.map(function(d){return "<span>"+d.short+"</span>";}).join("");

  document.getElementById("app").innerHTML=
  '<div class="wk-shell">'+
    '<header class="wk-head"><div class="wk-brand"><span class="wk-mark"></span>'+
      '<span class="wk-brandtxt">LEO<span class="wk-dot"> · </span>TRAINING CONSOLE</span></div>'+
      '<div class="wk-date">'+dateLabel+'</div></header>'+

    '<section class="wk-hero'+(status===true?" done":"")+'">'+
      '<div class="wk-hero-top"><div><div class="wk-eyebrow">Heute · '+WEEKDAYS[todayIdx].long+'</div>'+
      '<h1 class="wk-hero-title">'+todayEx.name+'</h1><div class="wk-hero-sub">'+todayEx.muscle+'</div></div>'+
      '<div class="wk-hero-ico">'+svg(todayEx.art,"wk-heroart")+'</div></div>'+
      '<div class="wk-prompt">'+prompt+'</div></section>'+

    '<nav class="wk-days">'+days+'</nav>'+

    '<section class="wk-panel"><div class="wk-panel-head"><div>'+
      '<div class="wk-eyebrow">Programm · '+WEEKDAYS[selected].long+'</div>'+
      '<h2 class="wk-panel-title">'+selEx.name+'<span class="wk-panel-muscle"> · '+selEx.muscle+'</span></h2></div>'+
      '<span class="wk-pill"><span class="wk-pulse"></span> Keine Pausen · Puls hoch</span></div>'+
      (selEx.note?'<div class="wk-exnote">'+selEx.note+'</div>':'')+
      '<ol class="wk-flow">'+flow+'</ol>'+
      '<div class="wk-notes"><div class="wk-notecard"><span class="wk-noteflag">Übungen</span>'+
      'Jedes Set bis zum Failure — außer das Aufwärmset.</div>'+
      '<div class="wk-notecard"><span class="wk-noteflag">Dailies</span>'+
      'Reps am Stück. Wenn nicht, minimal Pause oder direkt in eine leichtere Variante wechseln (z.&nbsp;B. Push-ups → Knie-Push-ups).</div></div></section>'+

    '<section class="wk-panel"><div class="wk-panel-head"><div class="wk-eyebrow">Verlauf</div>'+
      '<div class="wk-calnav"><button class="wk-navbtn" data-act="prev" aria-label="Voriger Monat">‹</button>'+
      '<span class="wk-calmonth">'+monthLabel+'</span>'+
      '<button class="wk-navbtn" data-act="next" aria-label="Nächster Monat">›</button></div></div>'+
      '<div class="wk-stats">'+
        stat(st.streak,"Serie","Tage")+stat(st.week,"Diese Woche","/ 7")+
        stat(st.month,"Dieser Monat","Tage")+stat(st.total,"Gesamt","Tage")+'</div>'+
      '<div class="wk-cal"><div class="wk-calhead">'+head+'</div>'+
      '<div class="wk-calgrid">'+cells+'</div>'+
      '<div class="wk-legend"><span><i class="lg on"></i> Trainiert</span>'+
      '<span><i class="lg rest"></i> Pause</span><span><i class="lg now"></i> Heute</span>'+
      '<span class="wk-legend-hint">Tag antippen zum Nachtragen</span></div></div></section>'+

    '<footer class="wk-foot">Fortschritt wird auf diesem Gerät gespeichert.</footer>'+
  '</div>';
}
function stat(v,label,unit){
  return '<div class="wk-stat"><div class="wk-statval">'+v+'<span class="wk-statunit"> '+unit+'</span></div>'+
    '<div class="wk-statlabel">'+label+'</div></div>';
}

/* ---------------- events ---------------- */
document.getElementById("app").addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="day"){selected=+el.getAttribute("data-i"); render();}
  else if(act==="yes"){setEntry(todayKey,true);}
  else if(act==="no"){setEntry(todayKey,false);}
  else if(act==="undo"){setEntry(todayKey,undefined);}
  else if(act==="resttoyes"){setEntry(todayKey,true);}
  else if(act==="prev"){calM--; if(calM<0){calM=11;calY--;} render();}
  else if(act==="next"){calM++; if(calM>11){calM=0;calY++;} render();}
  else if(act==="cell"){var k=el.getAttribute("data-key"); setEntry(k, log[k]===true?undefined:true);}
});

render();
</script>
</body>
</html>
